    <script>
      (function () {
        try {
          var saved = localStorage.getItem('stevetool-vpn-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');

          document.documentElement.classList.add('dark');
        }
      })();
    </script>
